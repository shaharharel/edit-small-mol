# EXP6_v3 — RL on top of EXP6_v2 (FT with Tc-filtered, class-balanced pairs).
# Adds FiLMDelta pIC50 reward + STRONG MatchingSubstructure(acrylamide) reward to
# avoid Mol2Mol_RL's failure mode (RL dropped warhead → 0.57% acryl retention).
#
# Prior path is filled in at queue-launch time (EXP6_v2 must finish first).

run_type = "staged_learning"
device = "cuda"
tb_logdir = "tb_exp6_v3"
json_out_config = "_exp6_v3.json"

[parameters]
summary_csv_prefix = "exp6_v3_rl"
use_checkpoint = false
purge_memories = false

# Prior placeholder — replaced by queue runner before launch
prior_file = "/home/shaharh_quris_ai/edit-small-mol/models/reinvent4_mol2mol_warhead_tokens_v2.prior"
agent_file = "/home/shaharh_quris_ai/edit-small-mol/models/reinvent4_mol2mol_warhead_tokens_v2.prior"
smiles_file = "/home/shaharh_quris_ai/edit-small-mol/data/zap70_top_actives_clean.smi"
sample_strategy = "multinomial"
distance_threshold = 100

batch_size = 64
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

### Stage 1 — initial RL push, modest pIC50 target
[[stage]]
chkpt_file = "exp6_v3_stage1.chkpt"
termination = "simple"
max_score = 0.7
min_steps = 15
max_steps = 50

[stage.scoring]
type = "geometric_mean"

# FiLMDelta pIC50
[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.45
params.executable = "/home/shaharh_quris_ai/miniconda3/envs/quris/bin/python"
params.args = "/home/shaharh_quris_ai/edit-small-mol/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 7.5
transform.low = 5.5
transform.k = 0.5

# Acrylamide retention — STRONG weight to avoid Mol2Mol_RL warhead-drop failure
[[stage.scoring.component]]
[stage.scoring.component.MatchingSubstructure]
[[stage.scoring.component.MatchingSubstructure.endpoint]]
name = "Acrylamide retained"
weight = 0.35
params.smarts = ["[CH2]=[CH]C(=O)N"]
params.use_chirality = false

# QED + unwanted SMARTS
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
weight = 0.10
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
]

### Stage 2 — push potency target higher with same warhead constraint
[[stage]]
chkpt_file = "exp6_v3_stage2.chkpt"
termination = "simple"
max_score = 0.8
min_steps = 10
max_steps = 30

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.50
params.executable = "/home/shaharh_quris_ai/miniconda3/envs/quris/bin/python"
params.args = "/home/shaharh_quris_ai/edit-small-mol/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 8.0
transform.low = 6.0
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.MatchingSubstructure]
[[stage.scoring.component.MatchingSubstructure.endpoint]]
name = "Acrylamide retained"
weight = 0.30
params.smarts = ["[CH2]=[CH]C(=O)N"]
params.use_chirality = false

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
weight = 0.10
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
]
