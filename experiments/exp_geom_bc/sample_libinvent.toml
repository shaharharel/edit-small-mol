# LibInvent baseline cohort — out-of-the-box (no FT) sampling with the
# acrylamide-isoindoline scaffold of Mol1 as the fixed core.
# Scaffold has 1 attachment point: C=CC(=O)N1Cc2cccc([*])c2C1
run_type = "sampling"
json_out_config = "_sample_libinvent.json"

[parameters]
model_file = "/Users/shaharharel/Documents/github/REINVENT4/priors/libinvent.prior"
smiles_file = "mol1_scaffold_libinvent.smi"
output_file = "samples_libinvent.csv"
num_smiles = 10000
unique_molecules = false
randomize_smiles = true
