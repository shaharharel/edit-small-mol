# EXP6_v5 — EXP6_Warhead_Tokens v1 (Phase B Vina 126.6 leader) + RL + full Vina-in-loop.
# Reward: FiLMDelta + acryl + Vina + QED (custom_alerts DROPPED).

run_type = "staged_learning"
device = "cuda"
tb_logdir = "tb_exp6_v5"
json_out_config = "_exp6_v5.json"

[parameters]
summary_csv_prefix = "exp6_v5_rl"
use_checkpoint = false
purge_memories = false

prior_file = "/home/shaharh_quris_ai/edit-small-mol/models/reinvent4_mol2mol_warhead_tokens.prior"
agent_file = "/home/shaharh_quris_ai/edit-small-mol/models/reinvent4_mol2mol_warhead_tokens.prior"
smiles_file = "/home/shaharh_quris_ai/edit-small-mol/data/zap70_acryl_curated_seeds.smi"
sample_strategy = "multinomial"
distance_threshold = 100

batch_size = 16
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

[[stage]]
chkpt_file = "exp6_v5_stage1.chkpt"
termination = "simple"
max_score = 0.7
min_steps = 15
max_steps = 50

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.50
params.executable = "/home/shaharh_quris_ai/miniconda3/envs/quris/bin/python"
params.args = "/home/shaharh_quris_ai/edit-small-mol/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 7.5
transform.low = 5.5
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "AD-CovDock Vina"
weight = 0.40
params.executable = "/home/shaharh_quris_ai/miniconda3/envs/quris/bin/python"
params.args = "/home/shaharh_quris_ai/edit-small-mol/experiments/reinvent4_vina_scorer.py"
params.property = "vina_score"
transform.type = "reverse_sigmoid"
transform.high = 250
transform.low = 100
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10
