# Sampling from trained DAP checkpoint. Placeholders {MODEL} and {OUT} filled by driver.

run_type = "sampling"
device = "cuda:0"
json_out_config = "/home/shaharh_quris_ai/paper_dap_repro/_sample_{TAG}.json"

[parameters]
model_file = "{MODEL}"
smiles_file = "/home/shaharh_quris_ai/edit-small-mol/data/zap70_top_actives_clean.smi"
sample_strategy = "multinomial"
temperature = 1.0
output_file = "{OUT}"

num_smiles = 240   # per input SMILES; 43 anchors x 240 = 10320 (post-dedup ~10k)
unique_molecules = false
randomize_smiles = true
