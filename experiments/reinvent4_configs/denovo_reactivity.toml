# REINVENT4: De Novo Generation with FiLMDelta + reactivity-aware warhead
# Generator: Reinvent (RNN) - generates molecules from scratch
# Scoring:   FiLMDelta pIC50  +  warhead-intact gate  +  reactivity gate
#            +  QED  +  custom alerts
#
# The reactivity scorer penalises warheads that are too reactive
# (off-target Cys) or not reactive enough (won't form Cys346 bond),
# rewarding warheads in the GSH-k2 sweet spot.
#
# Token placeholders (__CONDA_PATH__, __PROJECT_ROOT__) are filled
# by experiments/run_denovo_reactivity.py at runtime.

run_type = "staged_learning"
device = "cpu"
tb_logdir = "tb_denovo_reactivity"
json_out_config = "_denovo_reactivity.json"

[parameters]
summary_csv_prefix = "denovo_reactivity"
use_checkpoint = false
purge_memories = false

prior_file = "priors/reinvent.prior"
agent_file = "priors/reinvent.prior"

batch_size = 128
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4


### Stage 1: explore drug-like + warhead-bearing chemical space
[[stage]]
chkpt_file = "denovo_reactivity_stage1.chkpt"
termination = "simple"
max_score = 0.65
min_steps = 30
max_steps = 200

[stage.scoring]
type = "geometric_mean"

# (1) FiLMDelta absolute pIC50 prediction (anchor-based)
[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.45
params.executable = "__CONDA_PATH__"
params.args = "run --no-capture-output -n quris python __PROJECT_ROOT__/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 7.0
transform.low = 5.0
transform.k = 0.5

# (2) Warhead-intact hard gate (0/1)
[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Warhead intact"
weight = 0.15
params.executable = "__CONDA_PATH__"
params.args = "run --no-capture-output -n quris python __PROJECT_ROOT__/experiments/reinvent4_warhead_scorer.py"
params.property = "warhead"

# (3) Reactivity sweet-spot scorer (this experiment's contribution)
[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Reactivity"
weight = 0.20
params.executable = "__CONDA_PATH__"
params.args = "run --no-capture-output -n quris python __PROJECT_ROOT__/experiments/reinvent4_reactivity_scorer.py"
params.property = "reactivity"

# (4) QED for general drug-likeness
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10

# (5) Belt-and-braces structural alerts
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
weight = 0.10
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C(=[O,S])[O,S]",
]


### Stage 2: tighten potency target, keep the reactivity gate active
[[stage]]
chkpt_file = "denovo_reactivity_stage2.chkpt"
termination = "simple"
max_score = 0.75
min_steps = 25
max_steps = 200

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.50
params.executable = "__CONDA_PATH__"
params.args = "run --no-capture-output -n quris python __PROJECT_ROOT__/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 8.0
transform.low = 6.0
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Warhead intact"
weight = 0.15
params.executable = "__CONDA_PATH__"
params.args = "run --no-capture-output -n quris python __PROJECT_ROOT__/experiments/reinvent4_warhead_scorer.py"
params.property = "warhead"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "Reactivity"
weight = 0.20
params.executable = "__CONDA_PATH__"
params.args = "run --no-capture-output -n quris python __PROJECT_ROOT__/experiments/reinvent4_reactivity_scorer.py"
params.property = "reactivity"

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
weight = 0.05
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C(=[O,S])[O,S]",
]
