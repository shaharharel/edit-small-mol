# EXP2_V2_RL — RL on top of EXP2 (Mol2Mol fine-tuned on 855 CovInDB covalents).
# Same reward recipe as EXP6_v3 but starting from EXP2's prior (no vocab tokens).
# Goal: maintain EXP2's best-in-class cb_sasa (4.86 Å²) while boosting pIC50.

run_type = "staged_learning"
device = "cuda"
tb_logdir = "tb_exp2_v2_rl"
json_out_config = "_exp2_v2_rl.json"

[parameters]
summary_csv_prefix = "exp2_v2_rl"
use_checkpoint = false
purge_memories = false

prior_file = "/home/shaharh_quris_ai/edit-small-mol/models/reinvent4_mol2mol_covalent_ft.prior"
agent_file = "/home/shaharh_quris_ai/edit-small-mol/models/reinvent4_mol2mol_covalent_ft.prior"
smiles_file = "/home/shaharh_quris_ai/edit-small-mol/data/zap70_top_actives_clean.smi"
sample_strategy = "multinomial"
distance_threshold = 100

batch_size = 64
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

### Stage 1 — push pIC50 up while strongly preserving acrylamide
[[stage]]
chkpt_file = "exp2_v2_rl_stage1.chkpt"
termination = "simple"
max_score = 0.7
min_steps = 15
max_steps = 50

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.45
params.executable = "/home/shaharh_quris_ai/miniconda3/envs/quris/bin/python"
params.args = "/home/shaharh_quris_ai/edit-small-mol/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 7.5
transform.low = 5.5
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.MatchingSubstructure]
[[stage.scoring.component.MatchingSubstructure.endpoint]]
name = "Acrylamide retained"
weight = 0.35
params.smarts = ["[CH2]=[CH]C(=O)N"]
params.use_chirality = false

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
weight = 0.10
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
]

### Stage 2 — sustain pIC50 ≥6.5 with warhead intact
[[stage]]
chkpt_file = "exp2_v2_rl_stage2.chkpt"
termination = "simple"
max_score = 0.8
min_steps = 10
max_steps = 30

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "FiLMDelta pIC50"
weight = 0.50
params.executable = "/home/shaharh_quris_ai/miniconda3/envs/quris/bin/python"
params.args = "/home/shaharh_quris_ai/edit-small-mol/experiments/reinvent4_film_scorer.py"
params.property = "pIC50"
transform.type = "sigmoid"
transform.high = 8.0
transform.low = 6.0
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.MatchingSubstructure]
[[stage.scoring.component.MatchingSubstructure.endpoint]]
name = "Acrylamide retained"
weight = 0.30
params.smarts = ["[CH2]=[CH]C(=O)N"]
params.use_chirality = false

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.10

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
weight = 0.10
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
]
